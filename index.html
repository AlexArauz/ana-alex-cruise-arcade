<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d39"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Ana & Alex · Cruise Arcade</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f7ff;background:#101d39}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#101d39,#213b63);min-height:100vh}main{max-width:620px;margin:auto;padding:22px 16px 70px}h1{font-size:29px;margin:10px 0}h2{margin:14px 0}p{line-height:1.5;color:#c8d6ed}.muted{font-size:13px;color:#b8c8e4}.panel{background:#ffffff12;border:1px solid #ffffff22;border-radius:20px;padding:17px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:116px;text-align:left;font-size:18px}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;background:#48c8bd;color:#10213a;font-weight:750;cursor:pointer}button:disabled{opacity:.35}button.alt{background:#ffffff1c;color:#fff;border:1px solid #ffffff2c}button.danger{background:#f49a9a}button:focus-visible{outline:3px solid #fff}input,select{width:100%;background:#fff;color:#18243e;border:0;border-radius:10px;padding:12px;margin:6px 0 10px}label{font-size:14px;font-weight:650}header{display:flex;align-items:center;justify-content:space-between}.board4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#246bc2;padding:7px;border-radius:13px}.slot{aspect-ratio:1;border-radius:50%;background:#142d52;border:2px solid #ffffff26;padding:0}.slot.red{background:#fb6767}.slot.yellow{background:#ffd65d}.shipgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.cell{aspect-ratio:1;border-radius:4px;padding:0;background:#315b83;color:white;font-size:13px;min-width:0}.cell.ship{background:#50b4ad}.cell.hit{background:#e96a69}.cell.miss{background:#a2c1db;color:#193052}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.person{padding:8px 2px;background:#ffffff19;color:#fff;border:1px solid #ffffff33;min-height:82px;font-size:12px}.person.off{opacity:.22}.face{font-size:30px;display:block}.code{font-size:26px;letter-spacing:3px;text-align:center;background:#07152d;padding:15px;border-radius:12px;margin:10px 0;user-select:all}.pill{display:inline-block;background:#ffffff22;border-radius:30px;padding:5px 10px;margin:3px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px}.hidden{display:none}.notice{background:#f9c96b;color:#2d2330;padding:11px;border-radius:10px;font-size:13px;margin:10px 0}a{color:#8debe4}hr{border:0;border-top:1px solid #ffffff25;margin:22px 0}</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s),app=$('#app');let game='home',player=localStorage.getItem('arcade-player')||'Alex',c4=[],c4turn='Alex',fleet=[],enemy=[],ships=[5,4,3,3,2],shipIndex=0,shots=[],received=[],guessSecret='',eliminated=[],stopLetter='',stopAnswers={},stopSeconds=90,stopTimer=null,stopLeft=90,stopMode='Clásico';const names=['Luna','Marco','Sofía','Leo','Emma','Nico','Valeria','Tomás','Clara','Bruno','Mía','Diego','Olivia','Pablo','Sara','Hugo','Julia','Mateo','Iris','Lucas','Elena','Raúl','Alma','Noah'];const faces=['👩🏻','👨🏽','👩🏾','👨🏻','👩🏼','👨🏿','👩🏽','👨🏼','👩🏻‍🦰','👨🏻‍🦱','👩🏿','👨🏽‍🦱','👩🏼‍🦰','👨🏼‍🦳','👩🏽‍🦱','👨🏻‍🦰','👩🏻‍🦳','👨🏾','👩🏼‍🦱','👨🏿‍🦱','👩🏾‍🦱','👨🏻‍🦳','👩🏿‍🦰','👨🏼‍🦱'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shell(title,body){app.innerHTML=`<header><button class="alt" onclick="home()">⌂ Inicio</button><span class="pill">${esc(player)}</span></header><h1>${title}</h1>${body}`};function home(){game='home';clearInterval(stopTimer);app.innerHTML=`<h1>🚢 Ana & Alex</h1><p>CRUISE ARCADE ❤️ · Juegos para dos iPhones sin internet</p><div class="panel"><label>Este iPhone es de</label><select onchange="player=this.value;localStorage.setItem('arcade-player',player)"><option ${player==='Alex'?'selected':''}>Alex</option><option ${player==='Ana'?'selected':''}>Ana</option></select></div><div class="grid"><button class="tile alt" onclick="connect4()">🔴🟡<br>Connect 4</button><button class="tile alt" onclick="battleship()">🚢<br>Batalla Naval</button><button class="tile alt" onclick="guesswho()">🕵️<br>Guess Who?</button><button class="tile alt" onclick="stop()">📝<br>STOP</button></div><div class="panel"><b>Cómo jugar en dos teléfonos</b><p class="small">Cada iPhone funciona sin conexión. Para Connect 4 y Batalla Naval, digan en voz baja las coordenadas y resultados; en Guess Who hagan las preguntas entre ustedes. No hay sincronización automática ni Bluetooth.</p></div>`}function connect4(reset=true){game='c4';if(reset){c4=Array.from({length:6},()=>Array(7).fill(''));c4turn='Alex'}draw4()}function draw4(){let winner=winner4();shell('🔴🟡 Connect 4',`<p>Ambos abran Connect 4. En cada turno, quien juega dice el <b>número de columna (1–7)</b> y ambos la tocan en su teléfono.</p><div class="panel"><b>${winner?winner==='tie'?'¡Empate!':`🏆 Ganó ${winner}`:`Turno de ${c4turn} ${c4turn==='Alex'?'🔴':'🟡'}`}</b></div><div class="board4">${c4.flatMap((r,i)=>r.map((v,j)=>`<button aria-label="Fila ${i+1}, columna ${j+1}" class="slot ${v==='Alex'?'red':v==='Ana'?'yellow':''}" onclick="drop4(${j})" ${winner?'disabled':''}></button>`)).join('')}</div><p class="muted">Columnas: 1 · 2 · 3 · 4 · 5 · 6 · 7</p><button onclick="connect4()">Nueva partida</button>`)}function drop4(j){if(winner4())return;for(let i=5;i>=0;i--)if(!c4[i][j]){c4[i][j]=c4turn;c4turn=c4turn==='Alex'?'Ana':'Alex';break}draw4()}function winner4(){for(let r=0;r<6;r++)for(let c=0;c<7;c++)if(c4[r][c])for(let [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]])if([1,2,3].every(k=>c4[r+dr*k]?.[c+dc*k]===c4[r][c]))return c4[r][c];return c4.every(row=>row.every(Boolean))?'tie':null}
function battleship(){game='bs';fleet=Array(100).fill(0);enemy=Array(100).fill('');received=Array(100).fill('');shipIndex=0;shots=[];drawBS()}function drawBS(){let placing=shipIndex<ships.length;shell('🚢 Batalla Naval',`<p>Tu flota es secreta. Coloca tus barcos y luego alternen disparos diciendo coordenadas (por ejemplo, <b>B7</b>). Cada uno registra los tiros que recibe y realiza.</p><div class="panel"><b>${placing?'Coloca barco de '+ships[shipIndex]+' casillas':'Flota lista · ¡A jugar!'}</b>${placing?`<p class="small">Elige orientación y toca la casilla inicial. Los barcos no pueden superponerse.</p><select id="orient"><option value="h">Horizontal →</option><option value="v">Vertical ↓</option></select>`:''}<p class="small">Tu océano (privado)</p>${gridBS(fleet.map((v,i)=>received[i]==='hit'?'hit':received[i]==='miss'?'miss':v?'ship':''),'own')}</div>${!placing?`<div class="panel"><b>1. Recibí un disparo</b><p class="small">Toca la coordenada que te dice tu pareja en tu tablero de arriba. Confirma si fue agua o impacto.</p><b>2. Mis disparos al rival</b><p class="small">Toca la coordenada que disparaste y marca lo que te respondió tu pareja.</p>${gridBS(enemy,'enemy')}</div><button class="alt" onclick="battleship()">Nueva partida</button>`:''}`)}function gridBS(arr,type){return `<div style="display:grid;grid-template-columns:20px 1fr;gap:4px"><div></div><div style="display:grid;grid-template-columns:repeat(10,1fr);text-align:center;font-size:10px">${Array.from({length:10},(_,i)=>`<span>${i+1}</span>`).join('')}</div><div style="display:grid;grid-template-rows:repeat(10,1fr);align-items:center;text-align:center;font-size:10px">${'ABCDEFGHIJ'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="shipgrid">${arr.map((v,i)=>`<button aria-label="${'ABCDEFGHIJ'[Math.floor(i/10)]}${i%10+1}" class="cell ${v}" onclick="tapBS(${i},'${type}')">${v==='hit'?'✕':v==='miss'?'•':''}</button>`).join('')}</div></div>`}function tapBS(i,type){if(type==='own'&&shipIndex<ships.length){let n=ships[shipIndex],horizontal=$('#orient').value==='h',r=Math.floor(i/10),c=i%10,indices=Array.from({length:n},(_,k)=>horizontal?r*10+c+k:(r+k)*10+c);if(indices.some(x=>x>=100||(horizontal&&c+n>10)||(!horizontal&&r+n>10)||fleet[x])){alert('No cabe o se superpone. Elige otra posición.');return}indices.forEach(x=>fleet[x]=1);shipIndex++;drawBS();return}if(type==='own'){let hit=!!fleet[i];received[i]=hit?'hit':'miss';drawBS();alert(`${'ABCDEFGHIJ'[Math.floor(i/10)]}${i%10+1}: ${hit?'¡IMPACTO!':'Agua'}${fleet.every((v,j)=>!v||received[j]==='hit')?' · ¡Todos tus barcos hundidos!':''}`)}else{let v=prompt('Respuesta del rival para '+ 'ABCDEFGHIJ'[Math.floor(i/10)]+(i%10+1)+'\nEscribe A (agua) o I (impacto):','A');if(v===null)return;enemy[i]=v.trim().toUpperCase().startsWith('I')?'hit':'miss';drawBS()}}
function guesswho(){game='guess';eliminated=Array(24).fill(false);guessSecret='';drawGuess()}function drawGuess(){shell('🕵️ Guess Who?',`<p>Cada uno elige un personaje secreto <b>en su propio iPhone</b>. No enseñen la pantalla. Hagan preguntas de sí/no en voz baja y descarten candidatos tocándolos.</p><div class="panel"><label>Mi personaje secreto</label><select id="secret" onchange="guessSecret=this.value"> <option value="">Elegir en secreto...</option>${names.map((n,i)=>`<option value="${i}" ${guessSecret===String(i)?'selected':''}>${esc(n)}</option>`).join('')}</select><button class="alt" onclick="alert(guessSecret===''?'Aún no elegiste': 'Tu personaje: '+names[Number(guessSecret)])">Ver mi secreto</button></div><div class="people">${names.map((n,i)=>`<button class="person ${eliminated[i]?'off':''}" onclick="eliminated[${i}]=!eliminated[${i}];drawGuess()"><span class="face">${faces[i]}</span>${esc(n)}</button>`).join('')}</div><p class="muted">Las caras son ilustraciones emoji. Pregunten por características visibles, nombres o accesorios; acuerden las reglas antes de jugar.</p><button onclick="guesswho()">Nueva partida</button>`)}
const categories={'Clásico':['Nombre','País o ciudad','Animal','Comida','Marca','Color','Objeto'],'Crucero':['Nombre','País o ciudad','Animal','Comida','Marca','Color','Algo de vacaciones'],'Pareja':['Nombre','Lugar','Animal','Comida','Marca','Color','Algo romántico']};function stop(){game='stop';stopAnswers={};stopLetter='';stopLeft=90;drawStop()}function drawStop(){let cats=categories[stopMode];shell('📝 STOP',`<p>Cada uno escribe en su propio iPhone. Elijan <b>la misma letra</b> y comparen las respuestas al terminar.</p><div class="panel"><label>Modo</label><select onchange="stopMode=this.value;stopAnswers={};drawStop()">${Object.keys(categories).map(x=>`<option ${x===stopMode?'selected':''}>${x}</option>`).join('')}</select><label>Letra de la ronda</label><div class="row"><input id="letter" maxlength="1" value="${stopLetter}" placeholder="Ej. M" oninput="stopLetter=this.value.toUpperCase()"><button onclick="stopLetter='ABCDEFGHILMNOPRSTUV'[Math.floor(Math.random()*19)];drawStop()">🎲 Letra</button></div><label>Segundos</label><select id="duration"><option>60</option><option selected>90</option><option>120</option></select><div class="row"><button onclick="startStop()">▶ Iniciar</button><button class="danger" onclick="endStop()">🛑 STOP</button></div><h2 id="clock">${stopLeft}s</h2></div><div class="panel">${cats.map((cat,i)=>`<label>${esc(cat)}</label><input id="ans${i}" placeholder="Tu respuesta" value="${esc(stopAnswers[i]||'')}" oninput="stopAnswers[${i}]=this.value">`).join('')}</div><button onclick="alert('Comparen respuestas: 100 puntos si solo uno tiene respuesta válida, 50 si coinciden, 0 si está vacía o no es válida.')">📊 Reglas de puntos</button>`)}function startStop(){clearInterval(stopTimer);stopLeft=Number($('#duration').value);if(!stopLetter){alert('Primero elijan una letra');return}stopTimer=setInterval(()=>{stopLeft--;let el=$('#clock');if(el)el.textContent=stopLeft+'s';if(stopLeft<=0)endStop()},1000)}function endStop(){clearInterval(stopTimer);let el=$('#clock');if(el)el.textContent='🛑 ¡STOP!';document.querySelectorAll('[id^="ans"]').forEach(x=>x.disabled=true)}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
